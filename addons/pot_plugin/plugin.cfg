[plugin]

name="POT Plugin"
description="POT生成に含めるファイルをツリーで操作できるようにします。
場所:Project Settings/Localization/PotPlugin
何のファイルを含めるかなどのセーブデータは res://pot_plugin_save_data.cfg に保存されます。
ローカルの設定データ(ダークテーマ等の補助機能)は res://.godot/pot_plugin_local_setting.cfg に保存されます。(,godot内なので基本設定ならgitに無視されます)
使わない場合プラグインをオフにすることも可能です。
データは前述の場所にあり、オンかオフかに関わらず保存されています"
author="Airotto"
version="1.0"
script="pot_plugin.gd"
